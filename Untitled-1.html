<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet"> 
    <style>
        body {
            background: url('739b1e8eef3cfc0f9845100aa0a3ead4.gif') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Didot', serif;
            flex-direction: column;
            position: relative;
        }

        .clock {
            position: absolute;
            top: 20px;
            font-size: 24px;
            color: red;
            font-family: 'Uncial Antiqua', cursive;
            font-weight: bold;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid red;
        }

        .circle {
            width: 150px;
            height: 150px;
            background: red;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
            position: absolute;
            animation: pulse 1.5s infinite;
            border: 5px dotted white;
        }

        .circle::before, .circle::after {
            content: "";
            width: 85px;
            height: 85px;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: -50px;
        }

        .circle::before {
            left: -25px;
        }

        .circle::after {
            right: -25px;
        }

        .login-form {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border: 2px solid red;
            opacity: 0;
        }

        .login-form input {
            display: block;
            width: 200px;
            margin: 10px auto;
            padding: 10px;
            border: 2px solid red;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-form button {
            padding: 10px 20px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-form h2 {
            color: red;
            font-family: 'Uncial Antiqua', cursive;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes slideFadeIn {
            0% { opacity: 0; transform: translate(-50%, -100%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="clock" id="clock"></div>
    <div class="circle" id="enterButton" onclick="showLogin()">Enter</div>
    <div class="login-form" id="loginForm">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="storeLogin()">Login</button>
    </div>

    <script>
        let userLogins = [];

        function showLogin() {
            let loginForm = document.getElementById('loginForm');
            loginForm.style.display = 'block';
            loginForm.style.animation = 'slideFadeIn 0.6s ease-out forwards';
            document.getElementById('enterButton').style.display = 'none';
        }

        function storeLogin() {
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            
            if (username && password) {
                userLogins.push({ username, password });
                console.log("User Logins:", userLogins);
                alert("Login successful!");
            } else {
                alert("Please enter both username and password.");
            }
        }

        function updateClock() {
            let now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            let seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.addEventListener('keydown', function(event) {
            if (event.key === 'h' || event.key === 'H') {
                let forms = document.querySelectorAll('.login-form');
                forms.forEach(form => {
                    form.style.display = (form.style.display === 'none' || form.style.display === '') ? 'block' : 'none';
                });
            }
        });
    </script>
</body>
</html>
